<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador MD - GROMACS Web</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { Upload, Play, Pause, Download, AlertCircle, CheckCircle, Loader } = lucide;

        const MDSimulatorWeb = () => {
          const [pdbFile, setPdbFile] = useState(null);
          const [simulationStatus, setSimulationStatus] = useState('idle');
          const [progress, setProgress] = useState(0);
          const [logs, setLogs] = useState([]);
          const [results, setResults] = useState(null);
          const [isPlaying, setIsPlaying] = useState(false);
          const [frame, setFrame] = useState(0);
          const canvasRef = useRef(null);
          const animationRef = useRef(null);

          const runSimulation = async () => {
            setSimulationStatus('running');
            setLogs([]);
            setProgress(0);

            const steps = [
              'Cargando estructura PDB...',
              'Limpiando cristales de agua...',
              'Generando topología (CHARMM36)...',
              'Definiendo caja de simulación (1.2 nm)...',
              'Solvatando sistema (TIP3P)...',
              'Añadiendo iones para neutralizar...',
              'Minimización de energía...',
              'Equilibración NVT (100 ps)...',
              'Equilibración NPT (500 ps)...',
              'Producción MD (10 ns simulados)...',
              'Analizando RMSD y radio de gyration...',
              'Generando visualización 3D...'
            ];

            for (let i = 0; i < steps.length; i++) {
              await new Promise(resolve => setTimeout(resolve, 800));
              setLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] ${steps[i]}`]);
              setProgress(((i + 1) / steps.length) * 100);
            }

            const mockResults = {
              rmsd: Array.from({ length: 100 }, (_, i) => ({
                time: i * 0.1,
                value: 0.1 + Math.random() * 0.3 + i * 0.002
              })),
              rgyrate: Array.from({ length: 100 }, (_, i) => ({
                time: i * 0.1,
                value: 1.8 + Math.sin(i * 0.1) * 0.05
              })),
              energy: -125000 + Math.random() * 5000,
              frames: 100
            };

            setResults(mockResults);
            setSimulationStatus('completed');
          };

          useEffect(() => {
            if (!canvasRef.current || !results) return;

            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const width = canvas.width = 600;
            const height = canvas.height = 400;

            const drawMolecule = (frameNum) => {
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(0, 0, width, height);

              const centerX = width / 2;
              const centerY = height / 2;
              const rotation = (frameNum / 100) * Math.PI * 2;

              ctx.strokeStyle = '#3b82f6';
              ctx.lineWidth = 3;
              ctx.beginPath();
              
              for (let i = 0; i < 50; i++) {
                const angle = (i / 50) * Math.PI * 2 + rotation;
                const radius = 80 + Math.sin(i * 0.5 + frameNum * 0.1) * 20;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius * 0.6;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();
              ctx.stroke();

              for (let i = 0; i < 50; i++) {
                const angle = (i / 50) * Math.PI * 2 + rotation;
                const radius = 80 + Math.sin(i * 0.5 + frameNum * 0.1) * 20;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius * 0.6;
                
                ctx.fillStyle = i % 3 === 0 ? '#ef4444' : '#10b981';
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
              }

              ctx.fillStyle = '#fff';
              ctx.font = '14px monospace';
              ctx.fillText(`Frame: ${frameNum + 1}/100`, 10, 20);
              ctx.fillText(`Time: ${(frameNum * 0.1).toFixed(1)} ns`, 10, 40);
            };

            drawMolecule(frame);
          }, [frame, results]);

          useEffect(() => {
            if (isPlaying && results) {
              animationRef.current = setInterval(() => {
                setFrame(prev => (prev + 1) % results.frames);
              }, 50);
            } else {
              if (animationRef.current) clearInterval(animationRef.current);
            }
            return () => {
              if (animationRef.current) clearInterval(animationRef.current);
            };
          }, [isPlaying, results]);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file && file.name.endsWith('.pdb')) {
              setPdbFile(file);
              setSimulationStatus('ready');
            } else {
              alert('Por favor, sube un archivo PDB válido');
            }
          };

          const downloadResults = () => {
            const data = JSON.stringify(results, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'md_results.json';
            a.click();
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 text-white p-4">
              <div className="max-w-7xl mx-auto">
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                    Simulador de Dinámica Molecular
                  </h1>
                  <p className="text-slate-300">GROMACS-inspired | Visualización 3D Interactiva</p>
                </div>

                <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 mb-6 border border-slate-700">
                  <h2 className="text-xl font-semibold mb-4 flex items-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    1. Cargar Estructura PDB
                  </h2>
                  <div className="flex gap-4 items-center">
                    <label className="flex-1">
                      <input
                        type="file"
                        accept=".pdb"
                        onChange={handleFileUpload}
                        className="hidden"
                      />
                      <div className="border-2 border-dashed border-slate-600 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500 transition">
                        {pdbFile ? (
                          <div className="flex items-center justify-center gap-2 text-green-400">
                            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                              <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span>{pdbFile.name}</span>
                          </div>
                        ) : (
                          <div className="text-slate-400">
                            <svg className="w-8 h-8 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <p>Click para subir archivo PDB</p>
                            <p className="text-sm mt-1">o arrastra aquí</p>
                          </div>
                        )}
                      </div>
                    </label>
                    <button
                      onClick={runSimulation}
                      disabled={!pdbFile || simulationStatus === 'running'}
                      className="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-700 disabled:cursor-not-allowed px-6 py-3 rounded-lg font-semibold transition flex items-center gap-2"
                    >
                      <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" />
                      </svg>
                      Iniciar Simulación
                    </button>
                  </div>
                </div>

                {simulationStatus === 'running' && (
                  <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 mb-6 border border-slate-700">
                    <h2 className="text-xl font-semibold mb-4 flex items-center gap-2">
                      <svg className="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                      </svg>
                      Progreso de Simulación
                    </h2>
                    <div className="mb-4">
                      <div className="bg-slate-700 rounded-full h-4 overflow-hidden">
                        <div
                          className="bg-gradient-to-r from-blue-500 to-cyan-500 h-full transition-all duration-300"
                          style={{ width: `${progress}%` }}
                        />
                      </div>
                      <p className="text-right mt-2 text-slate-300">{Math.round(progress)}%</p>
                    </div>
                    <div className="bg-slate-900 rounded p-4 h-48 overflow-y-auto font-mono text-sm">
                      {logs.map((log, i) => (
                        <div key={i} className="text-green-400 mb-1">{log}</div>
                      ))}
                    </div>
                  </div>
                )}

                {results && (
                  <div className="grid md:grid-cols-2 gap-6">
                    <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 border border-slate-700">
                      <h2 className="text-xl font-semibold mb-4">Visualización 3D</h2>
                      <canvas
                        ref={canvasRef}
                        className="w-full rounded-lg bg-slate-900"
                      />
                      <div className="flex gap-2 mt-4">
                        <button
                          onClick={() => setIsPlaying(!isPlaying)}
                          className="flex-1 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded flex items-center justify-center gap-2"
                        >
                          {isPlaying ? (
                            <>
                              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" />
                              </svg>
                              Pausar
                            </>
                          ) : (
                            <>
                              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" />
                              </svg>
                              Reproducir
                            </>
                          )}
                        </button>
                        <input
                          type="range"
                          min="0"
                          max={results.frames - 1}
                          value={frame}
                          onChange={(e) => setFrame(Number(e.target.value))}
                          className="flex-1"
                        />
                      </div>
                    </div>

                    <div className="space-y-6">
                      <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 border border-slate-700">
                        <h3 className="text-lg font-semibold mb-3">RMSD (Cα)</h3>
                        <svg viewBox="0 0 400 150" className="w-full">
                          <polyline
                            points={results.rmsd.map((d, i) => 
                              `${i * 4},${150 - d.value * 150}`
                            ).join(' ')}
                            fill="none"
                            stroke="#3b82f6"
                            strokeWidth="2"
                          />
                        </svg>
                        <p className="text-sm text-slate-400 mt-2">
                          RMSD final: {results.rmsd[results.rmsd.length - 1].value.toFixed(3)} nm
                        </p>
                      </div>

                      <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 border border-slate-700">
                        <h3 className="text-lg font-semibold mb-3">Radio de Gyration</h3>
                        <svg viewBox="0 0 400 150" className="w-full">
                          <polyline
                            points={results.rgyrate.map((d, i) => 
                              `${i * 4},${150 - (d.value - 1.7) * 300}`
                            ).join(' ')}
                            fill="none"
                            stroke="#10b981"
                            strokeWidth="2"
                          />
                        </svg>
                        <p className="text-sm text-slate-400 mt-2">
                          Rg promedio: {(results.rgyrate.reduce((a, b) => a + b.value, 0) / results.rgyrate.length).toFixed(3)} nm
                        </p>
                      </div>

                      <div className="bg-slate-800/50 backdrop-blur rounded-lg p-6 border border-slate-700">
                        <h3 className="text-lg font-semibold mb-3">Resumen</h3>
                        <div className="space-y-2 text-sm">
                          <div className="flex justify-between">
                            <span className="text-slate-400">Energía Potencial:</span>
                            <span className="font-mono">{results.energy.toFixed(0)} kJ/mol</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Tiempo simulado:</span>
                            <span className="font-mono">10.0 ns</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Frames generados:</span>
                            <span className="font-mono">{results.frames}</span>
                          </div>
                        </div>
                        <button
                          onClick={downloadResults}
                          className="w-full mt-4 bg-green-600 hover:bg-green-700 px-4 py-2 rounded flex items-center justify-center gap-2"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                          </svg>
                          Descargar Resultados
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="mt-8 bg-blue-900/30 border border-blue-700 rounded-lg p-4">
                  <div className="flex gap-3">
                    <svg className="w-5 h-5 text-blue-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                    </svg>
                    <div className="text-sm text-blue-200">
                      <p className="font-semibold mb-1">Versión Demo</p>
                      <p>Esta es una simulación simplificada con visualización interactiva. Para simulaciones completas de GROMACS, consulta el repositorio GitHub con el backend completo.</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<MDSimulatorWeb />, document.getElementById('root'));
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
